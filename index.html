<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        input,
        select,
        button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .highlight {
            border: 2px solid green;
        }

        li {
            margin: 8px 0;
            padding: 8px;
            background-color: #eee;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container" id="container">

        <h1 id="title">Student Registration</h1>

        <!-- Registration Form -->
        <form id="studentForm">

            <label for="name">Student Name</label>

            <input type="text" id="name" placeholder="Enter student name">

            <label for="course">Course</label>

            <select id="course">

                <option value="">Select a course</option>

                <option value="JavaScript">
                    JavaScript
                </option>

                <option value="Python">
                    Python
                </option>

                <option value="HTML/CSS">
                    HTML/CSS
                </option>

            </select>

            <button type="submit">
                Register Student
            </button>

        </form>

        <p id="message"></p>

        <h2>Registered Students</h2>

        <ul id="studentList">
            <li>John</li>
            <li>Mary</li>
        </ul>

        <button id="clearButton">
            Clear Students
        </button>

    </div>
